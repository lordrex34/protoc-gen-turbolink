name: Build protoc-gen-turbolink

on:
  push:
    branches:
      - main
      - "refs/tags/*"
  pull_request:

jobs:
  build:
    name: Build protoc-gen-turbolink
    runs-on: windows-latest

    steps:
      # 1) Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2) Setup .NET SDK (needed for T4 CLI)
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 7.0.x

      # 3) Install T4 CLI globally
      - name: Install dotnet-t4 CLI
        run: dotnet tool install --global dotnet-t4-cli

      # 4) Transform T4 templates (.tt) into .cs
      - name: Transform T4 templates
        run: |
          echo "Transforming all T4 templates..."
          set PATH=%PATH%;%USERPROFILE%\.dotnet\tools
          for %%f in (protoc-gen-turbolink\Template\*.tt) do dotnet-t4 "%%f"

      # 5) Setup NuGet
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1

      # 6) Restore NuGet packages
      - name: Restore NuGet packages
        run: nuget restore protoc-gen-turbolink.sln

      # 7) Setup MSBuild
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1

      # 8) Build project in Release mode
      - name: Compile with MSBuild
        run: msbuild protoc-gen-turbolink.sln /p:Configuration=Release /p:Platform="Any CPU"

      # 9) Upload build artifacts
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: protoc-gen-turbolink
          path: |
            **/bin/Release/protoc-gen-turbolink.exe
            **/bin/Release/*.dll
