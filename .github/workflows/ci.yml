name: Build protoc-gen-turbolink

on:
  push:
    branches:
      - main
      - "refs/tags/*"
  pull_request:

jobs:
  build:
    name: Build protoc-gen-turbolink
    runs-on: windows-latest

    steps:
      # 1) Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2) Setup NuGet
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1

      # 3) Restore NuGet packages
      - name: Restore NuGet packages
        run: nuget restore protoc-gen-turbolink.sln

      # 4) Transform T4 templates (.tt) into .cs using TextTransform.exe
      - name: Transform T4 templates
        run: |
          echo "Transforming all T4 templates..."
          setlocal enabledelayedexpansion
          set TEXTTRANSFORM="C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\Common7\IDE\TextTransform.exe"
          for %%f in (protoc-gen-turbolink\Template\*.tt) do (
            echo "Processing %%f..."
            %TEXTTRANSFORM% "%%f"
          )

      # 5) Setup MSBuild
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1

      # 6) Build project in Release mode
      - name: Compile with MSBuild
        run: msbuild protoc-gen-turbolink.sln /p:Configuration=Release /p:Platform="Any CPU"

      # 7) Upload build artifacts
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: protoc-gen-turbolink
          path: |
            **/bin/Release/protoc-gen-turbolink.exe
            **/bin/Release/*.dll
