name: Build protoc-gen-turbolink

on:
  push:
    branches:
      - main
      - "refs/tags/*"
  pull_request:

jobs:
  build:
    name: Build protoc-gen-turbolink
    runs-on: windows-latest

    steps:
      # 1) Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2) Setup NuGet
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1

      - name: Restore NuGet packages
        run: nuget restore protoc-gen-turbolink.sln

      # 3) Setup MSBuild
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1

      # 4) Build with MSBuild
      - name: Compile with MSBuild
        run: |
          msbuild protoc-gen-turbolink.sln /p:Configuration=Release /p:Platform="Any CPU"

      # 5) Upload compiled binary
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: protoc-gen-turbolink
          path: |
            **/bin/Release/protoc-gen-turbolink.exe
            **/bin/Release/*.dll
